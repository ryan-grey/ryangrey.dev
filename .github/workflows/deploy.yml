name: Deploy to S3 + CloudFront

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race each other onto the same bucket.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # required: lets the job mint the OIDC token AWS validates

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    # NOTE: deliberately no `environment:` block here. Referencing a GitHub
    # environment changes the OIDC token's `sub` claim from
    #   repo:OWNER/REPO:ref:refs/heads/main
    # to
    #   repo:OWNER/REPO:environment:NAME
    # which would no longer match the role's trust policy condition.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No access keys anywhere. The job presents a short-lived OIDC token;
      # AWS validates it against the trust policy and returns temporary
      # credentials scoped to this role. They expire when the job ends.
      # Runs before any AWS call: a drifted chip row must never reach the
      # bucket, and this needs no credentials to detect.
      - name: Check stack manifest against the chip row
        run: python3 infra/check-stack-drift.py --readme

      - name: Check chatbot corpus against its sources
        run: python3 infra/check-corpus-drift.py

      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: us-east-1

      - name: Confirm assumed identity
        run: aws sts get-caller-identity

      # Every object gets a Cache-Control header. Before 2026-08-26 none did, so browsers
      # fell back to heuristic caching and kept serving a stale avatar and favicon after a
      # brand change -- a CloudFront invalidation does not help, because the stale copy is
      # in the visitor's browser, not the CDN. One hour bounds that, and revalidation after
      # it is a cheap 304.
      - name: Sync site to S3
        run: |
          aws s3 sync . s3://ryangrey.dev \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "infra/*" \
            --exclude ".gitignore" \
            --exclude "README.md" \
            --exclude ".DS_Store" \
            --exclude "CLAUDE.md" \
            --exclude ".claude/*" \
            --cache-control "public, max-age=3600, must-revalidate"

      # Two classes need something other than that default. These re-upload from the
      # workspace rather than doing an S3-to-S3 copy in place: a copy reads the source
      # object, and the deploy role has PutObject but deliberately not GetObject -- it
      # pushes the site, it has no business reading the bucket back.
      - name: Set the cache headers that differ from the default
        run: |
          # HTML must revalidate on every view, or a deploy stays invisible for an hour.
          for f in index.html ask/index.html; do
            aws s3 cp "$f" "s3://ryangrey.dev/$f" \
              --content-type "text/html" \
              --cache-control "public, max-age=0, must-revalidate" >/dev/null
            echo "  $f  max-age=0, must-revalidate"
          done
          # Card art is versioned in the filename, so a URL only ever holds one image and
          # can be cached forever. That is why the OG card is og-card-vN.png: scrapers
          # cache by URL and never revalidate.
          for f in og-card*.png; do
            [ -e "$f" ] || continue
            aws s3 cp "$f" "s3://ryangrey.dev/$f" \
              --content-type "image/png" \
              --cache-control "public, max-age=31536000, immutable" >/dev/null
            echo "  $f  immutable"
          done

      - name: Invalidate CloudFront cache
        run: |
          ID=$(aws cloudfront create-invalidation \
                 --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
                 --paths "/*" \
                 --query 'Invalidation.Id' --output text)
          echo "Invalidation: $ID"
          aws cloudfront wait invalidation-completed \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --id "$ID"
          echo "Invalidation complete."

      - name: Verify live site
        run: |
          CODE=$(curl -s -o /tmp/live.html -w '%{http_code}' https://ryangrey.dev/)
          echo "HTTP $CODE"
          test "$CODE" = "200"
          diff -q /tmp/live.html index.html \
            && echo "Live site matches committed index.html" \
            || { echo "Live site does not match repo"; exit 1; }

      # Byte-matching the commit is not the same as working. A relative asset
      # path can 403 on one of the two URLs a page is served at while every
      # file in the bucket is correct. This resolves each reference the way a
      # browser does and fetches it.
      - name: Verify page assets resolve
        run: python3 infra/check-page-assets.py
