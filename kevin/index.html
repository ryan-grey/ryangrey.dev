<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d1117">
    <title>&lt;3 Kevin</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0d1117;
        color: #f0f6fc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: clamp(1rem, 4vw, 2.5rem);
        background: #0d1117;
      }

      main {
        width: min(100%, 56.25rem);
        display: grid;
        justify-items: center;
        gap: clamp(1rem, 3vh, 1.75rem);
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 6vw, 4rem);
        line-height: 1;
        letter-spacing: -0.03em;
        text-align: center;
      }

      img {
        display: block;
        width: auto;
        height: auto;
        max-width: 100%;
        max-height: calc(100svh - 8rem);
        object-fit: contain;
        border: 1px solid #30363d;
        border-radius: 0.75rem;
        background: #161b22;
        box-shadow: 0 1rem 3rem rgb(1 4 9 / 40%);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>&lt;3 Kevin</h1>
      <img src="kevin.png" width="1290" height="1735" alt="Kevin the orange cat">
    </main>
  </body>
</html>
